<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MP-1 Player</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#B4AFA7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MP-1">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" id="touchIcon" href="data:,">
<link rel="manifest" id="manifestLink" href="data:,">
<style>
/* ==========================================================================
   MP-1 — portable audio player. Hardware is drawn with CSS + SVG, the
   display is a canvas dot-matrix. Design units: the device is laid out on a
   380 x 760 px board and scaled to fit the phone (see fitDevice()).
   Grid: 22 px side margin, 336 px content, 5 columns of 56 px / 14 px gutter.
   ========================================================================== */
:root {
  /* page */
  --page-hi: #D9D5CE;
  --page-lo: #A9A49B;
  /* device body: light anodised aluminium / off-white */
  --body: #E6E4DF;
  --body-edge: #C9C6BF;
  --face: #EBE9E4;
  /* graphite ink + greys */
  --ink: #222326;
  --ink-2: #4E4F53;
  --ink-3: #8B8A86;
  --grey-key: #D5D3CD;
  --graphite-key: #2B2C2F;
  /* the one hero accent */
  --orange: #FF5A1C;
  --orange-lo: #D8430D;
  /* status LEDs only */
  --led-green: #49E68F;
  --led-blue: #55B6FF;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace;
  --noise: none;
  --s: 1;
  color-scheme: light;
}

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--page-lo);
}
body {
  position: fixed;
  inset: 0;
  font-family: var(--mono);
  color: var(--ink);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  /* softly lit warm-grey studio surface with a gentle vignette */
  background:
    radial-gradient(120% 70% at 50% 38%, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 55%),
    radial-gradient(140% 100% at 50% 45%, var(--page-hi) 0%, #C3BEB6 55%, var(--page-lo) 100%);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* ---------- stage + device shell ---------------------------------------- */
#stage { position: fixed; inset: 0; overflow: hidden; }
.device {
  position: absolute;
  left: 50%; top: 50%;
  width: 380px; height: 760px;
  margin: -380px 0 0 -190px;
  transform: translate3d(0, var(--dy, 0px), 0) scale(var(--s));
  transform-origin: 50% 50%;
  border-radius: 40px;
  background: var(--body-edge);
  /* layered, physically plausible shadows: contact, near, far, ambient */
  box-shadow:
    0 0.5px 0 rgba(0,0,0,.18),
    0 1px 2px rgba(40,30,20,.16),
    0 4px 8px rgba(40,30,20,.12),
    0 14px 24px rgba(40,30,20,.14),
    0 32px 56px rgba(40,30,20,.16),
    0 60px 90px rgba(40,30,20,.12);
}
/* chamfer: a thin light-catching edge between the side wall and the face */
.device::before {
  content: "";
  position: absolute; inset: 0;
  border-radius: 40px;
  background: linear-gradient(180deg, #F7F6F2 0%, #DCD9D3 45%, #C4C1BA 100%);
}
.face {
  position: absolute; inset: 3px;
  border-radius: 37px;
  background-color: var(--face);
  background-image: var(--noise);
  background-size: 128px 128px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 -1px 0 rgba(0,0,0,.06),
    inset 0 0 0 0.5px rgba(0,0,0,.05);
  overflow: hidden;
}
/* very soft top-light falloff across the face (lighting, not decoration) */
.face::after {
  content: "";
  position: absolute; inset: 0;
  border-radius: inherit;
  background: radial-gradient(130% 60% at 50% 0%, rgba(255,255,255,.35), rgba(255,255,255,0) 70%);
  pointer-events: none;
}

.abs { position: absolute; left: calc(var(--x) * 1px); top: calc(var(--y) * 1px); }

/* ---------- silkscreen print ------------------------------------------- */
.print, .lbl {
  font-family: var(--mono);
  font-size: 7px;
  line-height: 1;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ink-2);
  white-space: nowrap;
}
.lbl .n { color: var(--ink-3); margin-right: .55em; font-weight: 500; }
.lbl--c { transform: translateX(-50%); text-align: center; }
.print--dim { color: var(--ink-3); }
.print--o { color: var(--orange); }

/* engraved (debossed) type: dark top edge, light bottom edge */
.engrave {
  font-family: var(--mono);
  font-weight: 700;
  color: #D3D0CA;
  text-shadow: 0 -0.6px 0 rgba(0,0,0,.28), 0 0.8px 0 rgba(255,255,255,.95);
  letter-spacing: .08em;
}

/* ---------- screws ------------------------------------------------------ */
.screw {
  position: absolute;
  width: 11px; height: 11px;
  margin: -5.5px 0 0 -5.5px;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 32%, #FFFFFF 0%, #D2D0CB 42%, #9E9C97 100%);
  box-shadow:
    0 0 0 1px rgba(0,0,0,.10),
    0 0 0 1.6px rgba(255,255,255,.55),
    inset 0 -0.5px 1px rgba(0,0,0,.35);
}
.screw::after {          /* hex socket */
  content: "";
  position: absolute; left: 50%; top: 50%;
  width: 4.6px; height: 4px;
  margin: -2px 0 0 -2.3px;
  background: #5E5C58;
  clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
  box-shadow: inset 0 1px 0 rgba(0,0,0,.6);
  transform: rotate(var(--r, 0deg));
}

/* ---------- display module --------------------------------------------- */
.bezel {
  position: absolute;
  left: 22px; top: 56px;
  width: 336px; height: 214px;
  border-radius: 16px;
  background: #1B1C1E;
  box-shadow:
    0 0 0 1px rgba(0,0,0,.08),
    0 1px 0 1.5px rgba(255,255,255,.7),
    inset 0 1px 0 rgba(255,255,255,.08),
    inset 0 -1px 0 rgba(0,0,0,.6);
}
.glass {
  position: absolute;
  left: 8px; top: 8px; right: 8px; bottom: 14px;
  border-radius: 7px;
  overflow: hidden;
  background: var(--lcd-bg, #0D0E0F);
  box-shadow: inset 0 2px 6px rgba(0,0,0,.85), inset 0 0 0 1px rgba(0,0,0,.9);
}
.glass canvas {
  position: absolute;
  left: 0; top: 4px;
  width: 320px; height: 184px;
}
/* glass: inner top shadow + a soft angled reflection, both static */
.glass::after {
  content: "";
  position: absolute; inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background:
    linear-gradient(115deg, rgba(255,255,255,.075) 0%, rgba(255,255,255,.03) 34%, rgba(255,255,255,0) 34.5%, rgba(255,255,255,0) 100%),
    linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0) 18%);
  box-shadow: inset 0 3px 8px rgba(0,0,0,.55);
}
.bezel .print { position: absolute; color: #6E6F72; font-size: 6px; }

/* ---------- LEDs --------------------------------------------------------- */
.led {
  position: absolute;
  width: 6px; height: 6px;
  margin: -3px 0 0 -3px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #8A8985, #5C5B58 70%);
  box-shadow: 0 0.5px 0 rgba(255,255,255,.9), inset 0 0.5px 1px rgba(0,0,0,.5);
}
.led i {
  position: absolute; inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #FFFFFF 0%, var(--c) 45%, var(--c) 100%);
  box-shadow: 0 0 4px 1px var(--c), 0 0 12px 2px var(--c);
  opacity: 0;
  transition: opacity 160ms ease-out;
  will-change: opacity;
}
.led.on i { opacity: 1; }
.led.dim i { opacity: .35; }
.led.blink i { animation: ledBlink 1.1s steps(1, end) infinite; }
.led.breathe i { animation: ledBreathe 2.6s ease-in-out infinite; }
@keyframes ledBlink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: .12; } }
@keyframes ledBreathe { 0%, 100% { opacity: .08; } 50% { opacity: .85; } }

/* ---------- keys --------------------------------------------------------- */
.key {
  position: absolute;
  width: 56px; height: 56px;
  touch-action: none;
  cursor: pointer;
  outline: none;
}
.key--wide { width: 196px; }
.key__well {
  position: absolute; inset: -3px;
  border-radius: 14px;
  background: #CFCCC6;
  box-shadow:
    inset 0 2px 3px rgba(0,0,0,.30),
    inset 0 0 0 0.5px rgba(0,0,0,.20),
    0 1px 0 rgba(255,255,255,.9);
}
.key__shadow {
  position: absolute; inset: 1px;
  border-radius: 11px;
  box-shadow: 0 3px 3px rgba(0,0,0,.30), 0 1px 1px rgba(0,0,0,.30);
  will-change: transform, opacity;
}
.key__cap {
  position: absolute; inset: 0;
  border-radius: 11px;
  display: grid; place-items: center;
  will-change: transform;
  background-color: var(--cap);
  background-image: var(--noise);
  background-size: 96px 96px;
  background-blend-mode: multiply;
  box-shadow:
    inset 0 1.5px 0 var(--cap-hi),
    inset 0 -2.5px 0 var(--cap-lo),
    inset 0 0 0 0.5px rgba(0,0,0,.18);
}
.key__cap svg { width: 22px; height: 22px; display: block; color: var(--cap-ink); }
.key__glow {            /* active-state glow printed into the key face */
  position: absolute; inset: 0;
  border-radius: 11px;
  opacity: 0;
  transition: opacity 180ms ease-out;
  box-shadow: inset 0 0 0 1.5px var(--orange), inset 0 0 10px rgba(255,90,28,.35);
  pointer-events: none;
}
.key.active .key__glow { opacity: 1; }
.key--grey  { --cap: var(--grey-key); --cap-hi: rgba(255,255,255,.85); --cap-lo: rgba(0,0,0,.14); --cap-ink: var(--ink); }
.key--dark  { --cap: var(--graphite-key); --cap-hi: rgba(255,255,255,.14); --cap-lo: rgba(0,0,0,.45); --cap-ink: #E7E5E0; }
.key--orange{ --cap: var(--orange); --cap-hi: rgba(255,214,190,.75); --cap-lo: rgba(120,30,0,.35); --cap-ink: var(--ink); }
.key--orange .key__glow { box-shadow: inset 0 0 14px rgba(255,255,255,.35); }
.key--orange .key__cap svg { width: 30px; height: 30px; }

/* ---------- encoder ------------------------------------------------------ */
.enc {
  position: absolute;
  left: 72px; top: 398px;          /* 236 x 236 printed field, centre 190,516 */
  width: 236px; height: 236px;
  touch-action: none;
}
.enc__scale { position: absolute; inset: 0; overflow: visible; }
.enc__well {
  position: absolute;
  left: 22px; top: 22px; width: 192px; height: 192px;
  border-radius: 50%;
  background: #C9C6BF;
  box-shadow: inset 0 3px 5px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.9);
}
.enc__shadow {
  position: absolute;
  left: 26px; top: 26px; width: 184px; height: 184px;
  border-radius: 50%;
  box-shadow: 0 6px 10px rgba(0,0,0,.30), 0 2px 3px rgba(0,0,0,.30);
  will-change: transform, opacity;
}
.enc__body {
  position: absolute;
  left: 26px; top: 26px; width: 184px; height: 184px;
  border-radius: 50%;
  will-change: transform;
}
.enc__knurl {
  position: absolute; inset: 0;
  border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, #8F8D88 0deg 1.5deg, #E2E0DB 1.5deg 3deg);
  will-change: transform;
}
.enc__face {
  position: absolute; inset: 7px;
  border-radius: 50%;
  /* lathe-turned face: fine concentric grooves + fixed anisotropic highlight */
  background:
    repeating-radial-gradient(circle at 50% 50%, rgba(0,0,0,.035) 0 0.6px, rgba(255,255,255,.05) 0.6px 1.3px),
    conic-gradient(from 20deg, #D9D7D2, #F6F5F2 12%, #CFCDC8 25%, #E9E8E4 38%, #C8C6C1 50%, #F4F3F0 62%, #CDCBC6 75%, #ECEBE7 88%, #D9D7D2);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.9),
    inset 0 -1px 1px rgba(0,0,0,.18),
    0 0 0 1px rgba(0,0,0,.18);
}
.enc__cap {
  position: absolute;
  left: 50%; top: 50%; width: 62px; height: 62px;
  margin: -31px 0 0 -31px;
  border-radius: 50%;
  background:
    repeating-radial-gradient(circle at 50% 50%, rgba(0,0,0,.03) 0 0.6px, rgba(255,255,255,.04) 0.6px 1.3px),
    conic-gradient(from 200deg, #D3D1CC, #F2F1EE 15%, #CBC9C4 30%, #EAE9E5 50%, #C6C4BF 65%, #F0EFEC 82%, #D3D1CC);
  box-shadow:
    0 0 0 1px rgba(0,0,0,.10),
    inset 0 2px 3px rgba(0,0,0,.18),
    inset 0 -1px 0 rgba(255,255,255,.8);
}
.enc__dot, .enc__dimple {
  position: absolute; left: 50%; top: 50%;
  border-radius: 50%;
  will-change: transform;
}
.enc__dot {
  width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px;
  background: var(--orange);
  box-shadow: inset 0 1px 1px rgba(255,255,255,.45), inset 0 -1px 1px rgba(0,0,0,.25), 0 0 0 0.5px rgba(0,0,0,.2);
}
.enc__dimple {
  width: 28px; height: 28px; margin: -14px 0 0 -14px;
  background: radial-gradient(circle at 50% 60%, #ECEBE7 0%, #D4D2CD 70%, #C3C1BC 100%);
  box-shadow: inset 0 2px 3px rgba(0,0,0,.28), inset 0 -1px 0 rgba(255,255,255,.9), 0 0.5px 0 rgba(255,255,255,.7);
}
.enc__hit { position: absolute; left: 18px; top: 18px; width: 200px; height: 200px; border-radius: 50%; }

/* ---------- speaker grilles --------------------------------------------- */
.spk {
  position: absolute;
  width: 30px; height: 126px;
  background-image:
    radial-gradient(circle at 50% 50%, #18191B 0 1.55px, rgba(0,0,0,.22) 1.65px 2.05px, rgba(0,0,0,0) 2.2px),
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.9) 0 2.05px, rgba(255,255,255,0) 2.3px);
  background-size: 7.5px 7px, 7.5px 7px;
  background-position: 0 0, 0 0.7px;
}

/* ---------- slide switches ---------------------------------------------- */
.sw { position: absolute; width: 40px; height: 14px; touch-action: none; cursor: pointer; }
.sw__slot {
  position: absolute; inset: 0;
  border-radius: 7px;
  background: #3A3B3E;
  box-shadow: inset 0 1.5px 2px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.95), 0 0 0 0.5px rgba(0,0,0,.2);
  overflow: hidden;
}
.sw__flag {             /* orange "locked" flag revealed by the HOLD slider */
  position: absolute; left: 3px; top: 3px; bottom: 3px; width: 14px;
  border-radius: 3px;
  background: var(--orange);
  opacity: 0;
}
.sw__thumb {
  position: absolute; left: 1.5px; top: 1.5px;
  width: 20px; height: 11px;
  border-radius: 5.5px;
  background-color: #E9E8E4;
  background-image: repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 2.5px, rgba(0,0,0,.16) 2.5px 3.2px);
  background-size: 10px 6px;
  background-position: center;
  background-repeat: no-repeat;
  box-shadow: inset 0 1px 0 #FFFFFF, inset 0 -1px 0 rgba(0,0,0,.18), 0 1px 1.5px rgba(0,0,0,.45);
  will-change: transform;
}

/* ---------- bottom rail ------------------------------------------------- */
.mic {
  position: absolute; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%;
  background: #1A1B1D; box-shadow: 0 0.6px 0 rgba(255,255,255,.95);
}
.reg { position: absolute; color: var(--ink-3); }
.reg svg { display: block; }

/* overlay art (connector lines, group brackets) */
.art { position: absolute; inset: 0; pointer-events: none; overflow: visible; }

/* hidden helpers (file input, haptic switch) */
.offscreen { position: fixed; left: -200px; top: 0; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; }

@media (prefers-reduced-motion: reduce) {
  .led.blink i, .led.breathe i { animation: none; opacity: .8; }
}
</style>
</head>
<body>
<div id="stage">
  <div class="device" id="device" aria-label="MP-1 portable audio player">
    <div class="face" id="face">

      <!-- screws -->
      <span class="screw" style="left:20px;top:20px;--r:14deg"></span>
      <span class="screw" style="left:356px;top:20px;--r:-33deg"></span>
      <span class="screw" style="left:20px;top:734px;--r:41deg"></span>
      <span class="screw" style="left:356px;top:734px;--r:-8deg"></span>

      <!-- top rail: sound switch / model / hold -->
      <div class="sw abs" id="swSnd" role="switch" aria-label="UI sounds" aria-checked="true" style="--x:44;--y:22">
        <div class="sw__slot"></div><div class="sw__thumb"></div>
      </div>
      <span class="lbl abs" style="--x:44;--y:40">snd</span>
      <span class="lbl abs print--dim" style="--x:66;--y:40">off on</span>

      <div class="abs engrave" style="--x:190;--y:18;font-size:17px;transform:translateX(-50%)">MP-1</div>
      <span class="lbl abs lbl--c print--dim" style="--x:190;--y:40;font-size:5.5px">portable audio player</span>

      <div class="sw abs" id="swHold" role="switch" aria-label="Hold" aria-checked="false" style="--x:296;--y:22">
        <div class="sw__slot"><div class="sw__flag"></div></div><div class="sw__thumb"></div>
      </div>
      <span class="lbl abs" style="--x:296;--y:40">hold</span>
      <svg class="abs" style="--x:327;--y:38.5" width="9" height="10" viewBox="0 0 9 10" aria-hidden="true">
        <rect x="1" y="4.2" width="7" height="5" rx="0.8" fill="#4E4F53"/>
        <path d="M2.6 4.4V3a1.9 1.9 0 0 1 3.8 0v1.4" fill="none" stroke="#4E4F53" stroke-width="1.1"/>
      </svg>

      <!-- display -->
      <div class="bezel" id="bezel">
        <div class="glass" id="glass"><canvas id="lcd" width="960" height="552"></canvas></div>
        <span class="print" style="left:10px;bottom:4px">160×92 dot matrix</span>
        <span class="print" style="right:10px;bottom:4px">01</span>
      </div>

      <!-- status LEDs, on the 5-column grid -->
      <span class="led" id="ledPwr"  style="left:50px;top:289px;--c:var(--led-green)"><i></i></span>
      <span class="led" id="ledPlay" style="left:120px;top:289px;--c:var(--led-green)"><i></i></span>
      <span class="led" id="ledAir"  style="left:190px;top:289px;--c:var(--led-blue)"><i></i></span>
      <span class="led" id="ledShuf" style="left:260px;top:289px;--c:var(--orange)"><i></i></span>
      <span class="led" id="ledRpt"  style="left:330px;top:289px;--c:var(--orange)"><i></i></span>
      <span class="lbl abs lbl--c print--dim" style="--x:50;--y:298">pwr</span>
      <span class="lbl abs lbl--c print--dim" style="--x:120;--y:298">play</span>
      <span class="lbl abs lbl--c print--dim" style="--x:190;--y:298">wireless</span>
      <span class="lbl abs lbl--c print--dim" style="--x:260;--y:298">shuffle</span>
      <span class="lbl abs lbl--c print--dim" style="--x:330;--y:298" id="lblRpt">repeat</span>

      <!-- function keys 01–05 -->
      <span class="lbl abs" style="--x:22;--y:316"><span class="n">01</span>menu</span>
      <span class="lbl abs" style="--x:92;--y:316"><span class="n">02</span>add</span>
      <span class="lbl abs" style="--x:162;--y:316"><span class="n">03</span>air</span>
      <span class="lbl abs" style="--x:232;--y:316"><span class="n">04</span>shuf</span>
      <span class="lbl abs" style="--x:302;--y:316"><span class="n">05</span>rpt</span>

      <div class="key key--grey abs" data-key="menu" role="button" aria-label="Menu / back" style="--x:22;--y:328">
        <span class="key__well"></span><span class="key__shadow"></span>
        <span class="key__cap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M5 7h14M5 12h14M5 17h8"/></svg><span class="key__glow"></span></span>
      </div>
      <div class="key key--grey abs" data-key="add" role="button" aria-label="Add songs" style="--x:92;--y:328">
        <span class="key__well"></span><span class="key__shadow"></span>
        <span class="key__cap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M12 5v14M5 12h14"/></svg><span class="key__glow"></span></span>
      </div>
      <div class="key key--grey abs" data-key="air" role="button" aria-label="Wireless output" style="--x:162;--y:328">
        <span class="key__well"></span><span class="key__shadow"></span>
        <span class="key__cap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M5.6 13.4a9 9 0 0 1 12.8 0M8.5 16.2a5 5 0 0 1 7 0"/><rect x="10.8" y="18.4" width="2.4" height="2.4" fill="currentColor" stroke="none"/><path d="M12 3.5v4" /></svg><span class="key__glow"></span></span>
      </div>
      <div class="key key--grey abs" data-key="shuf" role="button" aria-label="Shuffle" style="--x:232;--y:328">
        <span class="key__well"></span><span class="key__shadow"></span>

      <span class="lbl abs print--dim" style="--x:32;--y:427">seek</span>

<!-- hidden native helpers -->

<label class="offscreen" id="hapticLabel" aria-hidden="true"><input type="checkbox" id="hapticSwitch" switch></label>

<script>
'use strict';
/* =========================================================================
   MP-1 — runtime
   ========================================================================= */

/* ---------- 0. utils ---------------------------------------------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const now = () => performance.now();

/* ---------- 1. fit the device to the phone ------------------------------- */
const insetProbe = document.createElement('div');
insetProbe.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;' +
  'padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
document.body.appendChild(insetProbe);

function fitDevice() {
  const cs = getComputedStyle(insetProbe);
  const t = parseFloat(cs.paddingTop) || 0, b = parseFloat(cs.paddingBottom) || 0;
  const l = parseFloat(cs.paddingLeft) || 0, r = parseFloat(cs.paddingRight) || 0;
  const W = innerWidth, H = innerHeight;
  const availW = W - l - r - 16, availH = H - t - b - 16;
  const s = Math.min(availW / 380, availH / 760, 1.25);
  const root = document.documentElement.style;
  root.setProperty('--s', s.toFixed(4));
  // centre inside the safe area, not the raw viewport
  root.setProperty('--dy', ((t - b) / 2).toFixed(1) + 'px');
}
addEventListener('resize', fitDevice);
fitDevice();

/* ---------- 2. matte texture (generated once, tiled) -------------------- */
(function makeNoise() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const img = g.createImageData(128, 128);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 128 + (Math.random() - 0.5) * 255;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 10;                 // ~4% grain
  }
  g.putImageData(img, 0, 0);
  document.documentElement.style.setProperty('--noise', `url(${c.toDataURL()})`);
})();

/* ---------- 3. encoder scale (printed ticks) ---------------------------- */
(function drawScale() {
  const svg = $('#encScale');
  const NS = 'http://www.w3.org/2000/svg';
  const cx = 118, cy = 118;
  let d = '', dl = '';
  for (let i = 0; i < 48; i++) {
    const a = (i / 48) * Math.PI * 2 - Math.PI / 2;
    const major = i % 4 === 0;
    const r1 = 106, r2 = major ? 116 : 112;
    const x1 = cx + Math.cos(a) * r1, y1 = cy + Math.sin(a) * r1;
    const x2 = cx + Math.cos(a) * r2, y2 = cy + Math.sin(a) * r2;
    const seg = `M${x1.toFixed(2)} ${y1.toFixed(2)}L${x2.toFixed(2)} ${y2.toFixed(2)}`;
    if (major) dl += seg; else d += seg;
  }
  const p1 = document.createElementNS(NS, 'path');
  p1.setAttribute('d', d); p1.setAttribute('stroke', '#8B8A86'); p1.setAttribute('stroke-width', '0.8');
  const p2 = document.createElementNS(NS, 'path');
  p2.setAttribute('d', dl); p2.setAttribute('stroke', '#4E4F53'); p2.setAttribute('stroke-width', '1.1');
  svg.append(p1, p2);
  // index mark at 12 o'clock
  const m = document.createElementNS(NS, 'path');
  m.setAttribute('d', 'M114.5 0.5h7l-3.5 5z'); m.setAttribute('fill', '#FF5A1C');
  svg.append(m);
})();

/* ---------- 4. static encoder pose for the layout milestone ------------ */
(function poseEncoder(angleDeg) {
  const a = angleDeg * Math.PI / 180;
  $('#encKnurl').style.transform = `rotate(${angleDeg}deg)`;
  $('#encDot').style.transform = `translate(${Math.sin(a) * 78}px, ${-Math.cos(a) * 78}px)`;
  $('#encDimple').style.transform = `translate(${Math.sin(a + 2.2) * 56}px, ${-Math.cos(a + 2.2) * 56}px)`;
})(-28);

/* ---------- 5. HOLD/SND switch rest positions -------------------------- */
$('#swSnd .sw__thumb').style.transform = 'translateX(17px)';

/* ---------- 6. placeholder: lit dot grid on the display ----------------- */
(function testPattern() {
  const cv = $('#lcd'), g = cv.getContext('2d');
  const W = 160, H = 92, p = 6;
  cv.width = W * p; cv.height = H * p;
  g.fillStyle = '#0D0E0F'; g.fillRect(0, 0, cv.width, cv.height);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    g.fillStyle = 'rgba(255,255,255,.045)';
    g.fillRect(x * p, y * p, p - 1, p - 1);
  }
})();
</script>
