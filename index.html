<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MP-1 Player</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#B4AFA7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MP-1">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" id="touchIcon" href="data:,">
<link rel="manifest" id="manifestLink" href="data:,">
<style>
/* ==========================================================================
   MP-1 — portable audio player. Hardware is drawn with CSS + SVG, the
   display is a canvas dot-matrix. Design units: the device is laid out on a
   380 x 760 px board and scaled to fit the phone (see fitDevice()).
   Grid: 22 px side margin, 336 px content, 5 columns of 56 px / 14 px gutter.
   ========================================================================== */
:root {
  /* page */
  --page-hi: #D9D5CE;
  --page-lo: #A9A49B;
  /* device body: light anodised aluminium / off-white */
  --body: #E6E4DF;
  --body-edge: #C9C6BF;
  --face: #EBE9E4;
  /* graphite ink + greys */
  --ink: #222326;
  --ink-2: #4E4F53;
  --ink-3: #8B8A86;
  --grey-key: #D5D3CD;
  --graphite-key: #2B2C2F;
  /* the one hero accent */
  --orange: #FF5A1C;
  --orange-lo: #D8430D;
  /* status LEDs only */
  --led-green: #49E68F;
  --led-blue: #55B6FF;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace;
  --noise: none;
  --s: 1;
  color-scheme: light;
}

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--page-lo);
}
body {
  position: fixed;
  inset: 0;
  font-family: var(--mono);
  color: var(--ink);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  /* softly lit warm-grey studio surface with a gentle vignette */
  background:
    radial-gradient(120% 70% at 50% 38%, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 55%),
    radial-gradient(140% 100% at 50% 45%, var(--page-hi) 0%, #C3BEB6 55%, var(--page-lo) 100%);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* ---------- stage + device shell ---------------------------------------- */
#stage { position: fixed; inset: 0; overflow: hidden; }
.device {
  position: absolute;
  left: 50%; top: 50%;
  width: 380px; height: 760px;
  margin: -380px 0 0 -190px;
  transform: translate3d(0, var(--dy, 0px), 0) scale(var(--s));
  transform-origin: 50% 50%;
  border-radius: 40px;
  background: var(--body-edge);
  /* layered, physically plausible shadows: contact, near, far, ambient */
  box-shadow:
    0 0.5px 0 rgba(0,0,0,.18),
    0 1px 2px rgba(40,30,20,.16),
    0 4px 8px rgba(40,30,20,.12),
    0 14px 24px rgba(40,30,20,.14),
    0 32px 56px rgba(40,30,20,.16),
    0 60px 90px rgba(40,30,20,.12);
}
/* chamfer: a thin light-catching edge between the side wall and the face */
.device::before {
  content: "";
  position: absolute; inset: 0;
  border-radius: 40px;
  background: linear-gradient(180deg, #F7F6F2 0%, #DCD9D3 45%, #C4C1BA 100%);
}
.face {
  position: absolute; inset: 3px;
  border-radius: 37px;
  background-color: var(--face);
  background-image: var(--noise);
  background-size: 128px 128px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 -1px 0 rgba(0,0,0,.06),
    inset 0 0 0 0.5px rgba(0,0,0,.05);
  overflow: hidden;
}
/* very soft top-light falloff across the face (lighting, not decoration) */
.face::after {
  content: "";
  position: absolute; inset: 0;
  border-radius: inherit;
  background: radial-gradient(130% 60% at 50% 0%, rgba(255,255,255,.35), rgba(255,255,255,0) 70%);
  pointer-events: none;
}

.abs { position: absolute; left: calc(var(--x) * 1px); top: calc(var(--y) * 1px); }

/* ---------- silkscreen print ------------------------------------------- */
.print, .lbl {
  font-family: var(--mono);
  font-size: 7px;
  line-height: 1;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ink-2);
  white-space: nowrap;
}
.lbl .n { color: var(--ink-3); margin-right: .55em; font-weight: 500; }
.lbl--c { transform: translateX(-50%); text-align: center; }
.print--dim { color: var(--ink-3); }
.print--o { color: var(--orange); }

/* engraved (debossed) type: dark top edge, light bottom edge */
.engrave {
  font-family: var(--mono);
  font-weight: 700;
  color: #D3D0CA;
  text-shadow: 0 -0.6px 0 rgba(0,0,0,.28), 0 0.8px 0 rgba(255,255,255,.95);
  letter-spacing: .08em;
}

/* ---------- screws ------------------------------------------------------ */
.screw {
  position: absolute;
  width: 11px; height: 11px;
  margin: -5.5px 0 0 -5.5px;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 32%, #FFFFFF 0%, #D2D0CB 42%, #9E9C97 100%);
  box-shadow:
    0 0 0 1px rgba(0,0,0,.10),
    0 0 0 1.6px rgba(255,255,255,.55),
    inset 0 -0.5px 1px rgba(0,0,0,.35);
}
.screw::after {          /* hex socket */
  content: "";
  position: absolute; left: 50%; top: 50%;
  width: 4.6px; height: 4px;
  margin: -2px 0 0 -2.3px;
  background: #5E5C58;
  clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
  box-shadow: inset 0 1px 0 rgba(0,0,0,.6);
  transform: rotate(var(--r, 0deg));
}

/* ---------- display module --------------------------------------------- */
.bezel {
  position: absolute;
  left: 22px; top: 56px;
  width: 336px; height: 214px;
  border-radius: 16px;
  background: #1B1C1E;
  box-shadow:
    0 0 0 1px rgba(0,0,0,.08),
    0 1px 0 1.5px rgba(255,255,255,.7),
    inset 0 1px 0 rgba(255,255,255,.08),
    inset 0 -1px 0 rgba(0,0,0,.6);
}
.glass {
  position: absolute;
  left: 8px; top: 8px; right: 8px; bottom: 14px;
  border-radius: 7px;
  overflow: hidden;
  background: var(--lcd-bg, #0D0E0F);
  box-shadow: inset 0 2px 6px rgba(0,0,0,.85), inset 0 0 0 1px rgba(0,0,0,.9);
}
.glass canvas {
  position: absolute;
  left: 0; top: 4px;
  width: 320px; height: 184px;
}
/* glass: inner top shadow + a soft angled reflection, both static */
.glass::after {
  content: "";
  position: absolute; inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background:
    linear-gradient(115deg, rgba(255,255,255,.075) 0%, rgba(255,255,255,.03) 34%, rgba(255,255,255,0) 34.5%, rgba(255,255,255,0) 100%),
    linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0) 18%);
  box-shadow: inset 0 3px 8px rgba(0,0,0,.55);
}
.bezel .print { position: absolute; color: #6E6F72; font-size: 6px; }

/* ---------- LEDs --------------------------------------------------------- */
.led {
  position: absolute;
  width: 6px; height: 6px;
  margin: -3px 0 0 -3px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #8A8985, #5C5B58 70%);
  box-shadow: 0 0.5px 0 rgba(255,255,255,.9), inset 0 0.5px 1px rgba(0,0,0,.5);
}
.led i {
  position: absolute; inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #FFFFFF 0%, var(--c) 45%, var(--c) 100%);
  box-shadow: 0 0 4px 1px var(--c), 0 0 12px 2px var(--c);
  opacity: 0;
  transition: opacity 160ms ease-out;
  will-change: opacity;
}
.led.on i { opacity: 1; }
.led.dim i { opacity: .35; }
.led.blink i { animation: ledBlink 1.1s steps(1, end) infinite; }
.led.breathe i { animation: ledBreathe 2.6s ease-in-out infinite; }
@keyframes ledBlink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: .12; } }
@keyframes ledBreathe { 0%, 100% { opacity: .08; } 50% { opacity: .85; } }

/* ---------- keys --------------------------------------------------------- */
.key {
  position: absolute;
  width: 56px; height: 56px;
  touch-action: none;
  cursor: pointer;
  outline: none;
}
.key--wide { width: 196px; }
.key__well {
  position: absolute; inset: -3px;
  border-radius: 14px;
  background: #CFCCC6;
  box-shadow:
    inset 0 2px 3px rgba(0,0,0,.30),
    inset 0 0 0 0.5px rgba(0,0,0,.20),
    0 1px 0 rgba(255,255,255,.9);
}
.key__shadow {
  position: absolute; inset: 1px;
  border-radius: 11px;
  box-shadow: 0 3px 3px rgba(0,0,0,.30), 0 1px 1px rgba(0,0,0,.30);
  will-change: transform, opacity;
}
.key__cap {
  position: absolute; inset: 0;
  border-radius: 11px;
  display: grid; place-items: center;
  will-change: transform;
  background-color: var(--cap);
  background-image: var(--noise);
  background-size: 96px 96px;
  background-blend-mode: multiply;
  box-shadow:
    inset 0 1.5px 0 var(--cap-hi),
    inset 0 -2.5px 0 var(--cap-lo),
    inset 0 0 0 0.5px rgba(0,0,0,.18);
}
.key__cap svg { width: 22px; height: 22px; display: block; color: var(--cap-ink); }
.key__glow {            /* active-state glow printed into the key face */
  position: absolute; inset: 0;
  border-radius: 11px;
  opacity: 0;
  transition: opacity 180ms ease-out;
  box-shadow: inset 0 0 0 1.5px var(--orange), inset 0 0 10px rgba(255,90,28,.35);
  pointer-events: none;
}
.key.active .key__glow { opacity: 1; }
.key--grey  { --cap: var(--grey-key); --cap-hi: rgba(255,255,255,.85); --cap-lo: rgba(0,0,0,.14); --cap-ink: var(--ink); }
.key--dark  { --cap: var(--graphite-key); --cap-hi: rgba(255,255,255,.14); --cap-lo: rgba(0,0,0,.45); --cap-ink: #E7E5E0; }
.key--orange{ --cap: var(--orange); --cap-hi: rgba(255,214,190,.75); --cap-lo: rgba(120,30,0,.35); --cap-ink: var(--ink); }
.key--orange .key__glow { box-shadow: inset 0 0 14px rgba(255,255,255,.35); }
.key--orange .key__cap svg { width: 30px; height: 30px; }

/* ---------- encoder ------------------------------------------------------ */
.enc {
  position: absolute;
  left: 72px; top: 398px;          /* 236 x 236 printed field, centre 190,516 */
  width: 236px; height: 236px;
  touch-action: none;
}
.enc__scale { position: absolute; inset: 0; overflow: visible; }
.enc__well {
  position: absolute;
  left: 22px; top: 22px; width: 192px; height: 192px;
  border-radius: 50%;
  background: #C9C6BF;
  box-shadow: inset 0 3px 5px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.9);
}
.enc__shadow {
  position: absolute;
  left: 26px; top: 26px; width: 184px; height: 184px;
  border-radius: 50%;
  box-shadow: 0 6px 10px rgba(0,0,0,.30), 0 2px 3px rgba(0,0,0,.30);
  will-change: transform, opacity;
}
.enc__body {
  position: absolute;
  left: 26px; top: 26px; width: 184px; height: 184px;
  border-radius: 50%;
  will-change: transform;
}
.enc__knurl {
  position: absolute; inset: 0;
  border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, #8F8D88 0deg 1.5deg, #E2E0DB 1.5deg 3deg);
  will-change: transform;
}
.enc__face {
  position: absolute; inset: 7px;
  border-radius: 50%;
  /* lathe-turned face: fine concentric grooves + fixed anisotropic highlight */
  background:
    repeating-radial-gradient(circle at 50% 50%, rgba(0,0,0,.035) 0 0.6px, rgba(255,255,255,.05) 0.6px 1.3px),
    conic-gradient(from 20deg, #D9D7D2, #F6F5F2 12%, #CFCDC8 25%, #E9E8E4 38%, #C8C6C1 50%, #F4F3F0 62%, #CDCBC6 75%, #ECEBE7 88%, #D9D7D2);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.9),
    inset 0 -1px 1px rgba(0,0,0,.18),
    0 0 0 1px rgba(0,0,0,.18);
}
.enc__cap {
  position: absolute;
  left: 50%; top: 50%; width: 62px; height: 62px;
  margin: -31px 0 0 -31px;
  border-radius: 50%;
  background:
    repeating-radial-gradient(circle at 50% 50%, rgba(0,0,0,.03) 0 0.6px, rgba(255,255,255,.04) 0.6px 1.3px),
    conic-gradient(from 200deg, #D3D1CC, #F2F1EE 15%, #CBC9C4 30%, #EAE9E5 50%, #C6C4BF 65%, #F0EFEC 82%, #D3D1CC);
  box-shadow:
    0 0 0 1px rgba(0,0,0,.10),
    inset 0 2px 3px rgba(0,0,0,.18),
    inset 0 -1px 0 rgba(255,255,255,.8);
}
.enc__dot, .enc__dimple {
  position: absolute; left: 50%; top: 50%;
  border-radius: 50%;
  will-change: transform;
}
.enc__dot {
  width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px;
  background: var(--orange);
  box-shadow: inset 0 1px 1px rgba(255,255,255,.45), inset 0 -1px 1px rgba(0,0,0,.25), 0 0 0 0.5px rgba(0,0,0,.2);
}
.enc__dimple {
  width: 28px; height: 28px; margin: -14px 0 0 -14px;
  background: radial-gradient(circle at 50% 60%, #ECEBE7 0%, #D4D2CD 70%, #C3C1BC 100%);
  box-shadow: inset 0 2px 3px rgba(0,0,0,.28), inset 0 -1px 0 rgba(255,255,255,.9), 0 0.5px 0 rgba(255,255,255,.7);
}
.enc__hit { position: absolute; left: 18px; top: 18px; width: 200px; height: 200px; border-radius: 50%; }

/* ---------- speaker grilles --------------------------------------------- */
.spk {
  position: absolute;
  width: 30px; height: 126px;
  background-image:
    radial-gradient(circle at 50% 50%, #18191B 0 1.55px, rgba(0,0,0,.22) 1.65px 2.05px, rgba(0,0,0,0) 2.2px),
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.9) 0 2.05px, rgba(255,255,255,0) 2.3px);
  background-size: 7.5px 7px, 7.5px 7px;
  background-position: 0 0, 0 0.7px;
}

/* ---------- slide switches ---------------------------------------------- */
.sw { position: absolute; width: 40px; height: 14px; touch-action: none; cursor: pointer; }
.sw__slot {
  position: absolute; inset: 0;
  border-radius: 7px;
  background: #3A3B3E;
  box-shadow: inset 0 1.5px 2px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.95), 0 0 0 0.5px rgba(0,0,0,.2);
  overflow: hidden;
}
.sw__flag {             /* orange "locked" flag revealed by the HOLD slider */
  position: absolute; left: 3px; top: 3px; bottom: 3px; width: 14px;
  border-radius: 3px;
  background: var(--orange);
  opacity: 0;
}
.sw__thumb {
  position: absolute; left: 1.5px; top: 1.5px;
  width: 20px; height: 11px;
  border-radius: 5.5px;
  background-color: #E9E8E4;
  background-image: repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 2.5px, rgba(0,0,0,.16) 2.5px 3.2px);
  background-size: 10px 6px;
  background-position: center;
  background-repeat: no-repeat;
  box-shadow: inset 0 1px 0 #FFFFFF, inset 0 -1px 0 rgba(0,0,0,.18), 0 1px 1.5px rgba(0,0,0,.45);
  will-change: transform;
}

/* ---------- bottom rail ------------------------------------------------- */
.mic {
  position: absolute; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%;
  background: #1A1B1D; box-shadow: 0 0.6px 0 rgba(255,255,255,.95);
}
.reg { position: absolute; color: var(--ink-3); }
.reg svg { display: block; }

/* overlay art (connector lines, group brackets) */
.art { position: absolute; inset: 0; pointer-events: none; overflow: visible; }

/* hidden helpers (file input, haptic switch) */
.offscreen { position: fixed; left: -200px; top: 0; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; }

@media (prefers-reduced-motion: reduce) {
  .led.blink i, .led.breathe i { animation: none; opacity: .8; }
}
</style>
</head>
<body>
<div id="stage">
  <div class="device" id="device" aria-label="MP-1 portable audio player">
    <div class="face" id="face">

      <!-- screws -->
      <span class="screw" style="left:20px;top:20px;--r:14deg"></span>
      <span class="screw" style="left:356px;top:20px;--r:-33deg"></span>
      <span class="screw" style="left:20px;top:734px;--r:41deg"></span>
      <span class="screw" style="left:356px;top:734px;--r:-8deg"></span>

      <!-- top rail: sound switch / model / hold -->
      <div class="sw abs" id="swSnd" role="switch" aria-label="UI sounds" aria-checked="true" style="--x:44;--y:22">
        <div class="sw__slot"></div><div class="sw__thumb"></div>
      </div>
      <span class="lbl abs" style="--x:44;--y:40">snd</span>
      <span class="lbl abs print--dim" style="--x:66;--y:40">off on</span>

      <div class="abs engrave" style="--x:190;--y:18;font-size:17px;transform:translateX(-50%)">MP-1</div>
      <span class="lbl abs lbl--c print--dim" style="--x:190;--y:40;font-size:5.5px">portable audio player</span>

      <div class="sw abs" id="swHold" role="switch" aria-label="Hold" aria-checked="false" style="--x:296;--y:22">
        <div class="sw__slot"><div class="sw__flag"></div></div><div class="sw__thumb"></div>
      </div>
      <span class="lbl abs" style="--x:296;--y:40">hold</span>
      <svg class="abs" style="--x:327;--y:38.5" width="9" height="10" viewBox="0 0 9 10" aria-hidden="true">
        <rect x="1" y="4.2" width="7" height="5" rx="0.8" fill="#4E4F53"/>
        <path d="M2.6 4.4V3a1.9 1.9 0 0 1 3.8 0v1.4" fill="none" stroke="#4E4F53" stroke-width="1.1"/>
      </svg>

      <!-- display -->
      <div class="bezel" id="bezel">
        <div class="glass" id="glass"><canvas id="lcd" width="960" height="552"></canvas></div>
        <span class="print" style="left:10px;bottom:4px">160×92 dot matrix</span>
        <span class="print" style="right:10px;bottom:4px">01</span>
      </div>

      <!-- status LEDs, on the 5-column grid -->
      <span class="led" id="ledPwr"  style="left:50px;top:289px;--c:var(--led-green)"><i></i></span>
      <span class="led" id="ledPlay" style="left:120px;top:289px;--c:var(--led-green)"><i></i></span>
      <span class="led" id="ledAir"  style="left:190px;top:289px;--c:var(--led-blue)"><i></i></span>
      <span class="led" id="ledShuf" style="left:260px;top:289px;--c:var(--orange)"><i></i></span>
      <span class="led" id="ledRpt"  style="left:330px;top:289px;--c:var(--orange)"><i></i></span>
      <span class="lbl abs lbl--c print--dim" style="--x:50;--y:298">pwr</span>
      <span class="lbl abs lbl--c print--dim" style="--x:120;--y:298">play</span>
      <span class="lbl abs lbl--c print--dim" style="--x:190;--y:298">wireless</span>
      <span class="lbl abs lbl--c print--dim" style="--x:260;--y:298">shuffle</span>
      <span class="lbl abs lbl--c print--dim" style="--x:330;--y:298" id="lblRpt">repeat</span>

      <!-- function keys 01–05 -->
      <span class="lbl abs" style="--x:22;--y:316"><span class="n">01</span>menu</span>
      <span class="lbl abs" style="--x:92;--y:316"><span class="n">02</span>add</span>
      <span class="lbl abs" style="--x:162;--y:316"><span class="n">03</span>air</span>
      <span class="lbl abs" style="--x:232;--y:316"><span class="n">04</span>shuf</span>
      <span class="lbl abs" style="--x:302;--y:316"><span class="n">05</span>rpt</span>

      <div class="key key--grey abs" data-key="menu" role="button" aria-label="Menu / back" style="--x:22;--y:328">
        <span class="key__well"></span><span class="key__shadow"></span>
        <span class="key__cap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M5 7h14M5 12h14M5 17h8"/></svg><span class="key__glow"></span></span>
      </div>
      <div class="key key--grey abs" data-key="add" role="button" aria-label="Add songs" style="--x:92;--y:328">
        <span class="key__well"></span><span class="key__shadow"></span>
        <span class="key__cap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M12 5v14M5 12h14"/></svg><span class="key__glow"></span></span>
      </div>
      <div class="key key--grey abs" data-key="air" role="button" aria-label="Wireless output" style="--x:162;--y:328">
        <span class="key__well"></span><span class="key__shadow"></span>
        <span class="key__cap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M5.6 13.4a9 9 0 0 1 12.8 0M8.5 16.2a5 5 0 0 1 7 0"/><rect x="10.8" y="18.4" width="2.4" height="2.4" fill="currentColor" stroke="none"/><path d="M12 3.5v4" /></svg><span class="key__glow"></span></span>
      </div>

<script>
'use strict';
/* =========================================================================
   MP-1 — runtime
   ========================================================================= */

/* ---------- 0. utils ---------------------------------------------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const now = () => performance.now();

/* ---------- 1. fit the device to the phone ------------------------------- */
const insetProbe = document.createElement('div');
insetProbe.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;' +
  'padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
document.body.appendChild(insetProbe);

function fitDevice() {
  const cs = getComputedStyle(insetProbe);
  const t = parseFloat(cs.paddingTop) || 0, b = parseFloat(cs.paddingBottom) || 0;
  const l = parseFloat(cs.paddingLeft) || 0, r = parseFloat(cs.paddingRight) || 0;
  const W = innerWidth, H = innerHeight;
  const availW = W - l - r - 16, availH = H - t - b - 16;
  const s = Math.min(availW / 380, availH / 760, 1.25);
  const root = document.documentElement.style;
  root.setProperty('--s', s.toFixed(4));
  // centre inside the safe area, not the raw viewport
  root.setProperty('--dy', ((t - b) / 2).toFixed(1) + 'px');
}

fitDevice();

/* ---------- 2. matte texture (generated once, tiled) -------------------- */
(function makeNoise() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const img = g.createImageData(128, 128);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 128 + (Math.random() - 0.5) * 255;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 10;                 // ~4% grain
  }
  g.putImageData(img, 0, 0);
  document.documentElement.style.setProperty('--noise', `url(${c.toDataURL()})`);
})();

/* ---------- 3. encoder scale (printed ticks) ---------------------------- */
(function drawScale() {
  const svg = $('#encScale');
  const NS = 'http://www.w3.org/2000/svg';
  const cx = 118, cy = 118;
  let d = '', dl = '';
  for (let i = 0; i < 48; i++) {
    const a = (i / 48) * Math.PI * 2 - Math.PI / 2;
    const major = i % 4 === 0;
    const r1 = 106, r2 = major ? 116 : 112;
    const x1 = cx + Math.cos(a) * r1, y1 = cy + Math.sin(a) * r1;
    const x2 = cx + Math.cos(a) * r2, y2 = cy + Math.sin(a) * r2;
    const seg = `M${x1.toFixed(2)} ${y1.toFixed(2)}L${x2.toFixed(2)} ${y2.toFixed(2)}`;
    if (major) dl += seg; else d += seg;
  }
  const p1 = document.createElementNS(NS, 'path');
  p1.setAttribute('d', d); p1.setAttribute('stroke', '#8B8A86'); p1.setAttribute('stroke-width', '0.8');
  const p2 = document.createElementNS(NS, 'path');
  p2.setAttribute('d', dl); p2.setAttribute('stroke', '#4E4F53'); p2.setAttribute('stroke-width', '1.1');
  svg.append(p1, p2);

  const m = document.createElementNS(NS, 'path');
  m.setAttribute('d', 'M114.5 0.5h7l-3.5 5z'); m.setAttribute('fill', '#FF5A1C');
  svg.append(m);
})();

/* ---------- 4. store ----------------------------------------------------

   the display dirty, refreshes LEDs and schedules a (throttled) save.      */
const PERSIST_KEY = 'mp1.state.v1';
const S = {
  power: 'off',            // off | boot | on
  screen: 'empty',         // now | empty | list
  tracks: [],              // library meta, in play order of the library
  cur: -1,                 // index into tracks
  playing: false,
  t: 0, dur: 0,            // seconds
  vol: 0.8,                // 0..1 (DSP output)
  shuffle: false,
  repeat: 0,               // 0 off, 1 all, 2 one
  encMode: 0,              // 0 VOL, 1 SEEK, 2 SCRL
  hold: false,
  wireless: false, wirelessAvail: false,
  set: { sound: true, haptics: true, bright: 4, theme: 0, out: 'dsp' },
  resumeId: null, resumeT: 0,

function loadPersisted() {
  try {
    const raw = localStorage.getItem(PERSIST_KEY);
    if (!raw) return;
    const p = JSON.parse(raw);
    if (p.set) Object.assign(S.set, p.set);
    if (typeof p.vol === 'number') S.vol = clamp(p.vol, 0, 1);
    S.shuffle = !!p.shuffle;
    S.repeat = [0, 1, 2].includes(p.repeat) ? p.repeat : 0;
    S.encMode = [0, 1, 2].includes(p.encMode) ? p.encMode : 0;
    S.resumeId = p.curId || null;
    S.resumeT = +p.t || 0;
  } catch (e) { /* private mode or corrupt: run with defaults */ }
}
let saveTimer = 0;
function savePersisted(immediate) {
  clearTimeout(saveTimer);
  const doSave = () => {
    try {
      const tr = S.tracks[S.cur];
      localStorage.setItem(PERSIST_KEY, JSON.stringify({
        set: S.set, vol: S.vol, shuffle: S.shuffle, repeat: S.repeat, encMode: S.encMode,
        curId: tr ? tr.id : S.resumeId, t: tr ? S.t : S.resumeT,
      }));
    } catch (e) { /* storage full / blocked: not fatal */ }
  };
  if (immediate) doSave(); else saveTimer = setTimeout(doSave, 600);
}
const listeners = [];
function commit() {
  for (const fn of listeners) fn();
  LCD.dirty = true;
  savePersisted();
}
loadPersisted();

/* ---------- 5. UI sound synth (Web Audio, dry + short) ------------------ */
const Snd = {
  ctx: null, bus: null, noise: null,
  init() {
    if (this.ctx) return this.ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {
      this.ctx = new AC({ latencyHint: 'interactive' });
    } catch (e) { try { this.ctx = new AC(); } catch (e2) { return null; } }
    const c = this.ctx;
    this.bus = c.createGain();
    this.bus.gain.value = 0.32;            // UI sits well under the music
    this.bus.connect(c.destination);
    const len = Math.floor(c.sampleRate * 0.25);
    this.noise = c.createBuffer(1, len, c.sampleRate);
    const d = this.noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return c;
  },
  unlock() {
    const c = this.init();
    if (!c) return;
    if (c.state !== 'running') c.resume().catch(() => {});
    // a one-sample silent buffer fully unlocks output on iOS
    const b = c.createBuffer(1, 1, c.sampleRate), s = c.createBufferSource();
    s.buffer = b; s.connect(c.destination); s.start(0);
  },
  ok() { return this.ctx && S.set.sound && this.ctx.state === 'running'; },
  burst(t, dur, f, q, gain, type = 'bandpass') {
    const c = this.ctx, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise;
    fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.0008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(this.bus);
    s.start(t, Math.random() * 0.2); s.stop(t + dur + 0.01);
  },
  tone(t, f0, f1, dur, gain, type = 'sine') {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.bus);
    o.start(t); o.stop(t + dur + 0.02);
  },
  keyDown(heavy) {
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    this.burst(t, 0.014, 2600, 1.1, 0.55);
    this.tone(t, heavy ? 150 : 210, heavy ? 90 : 120, 0.04, heavy ? 0.42 : 0.3);
  },
  keyUp() {
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    this.burst(t, 0.008, 5200, 0.8, 0.22, 'highpass');
    this.tone(t, 520, 380, 0.012, 0.06);
  },
  tick(mode) {
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    const f = [3400, 2600, 4200][mode | 0] || 3400;
    this.burst(t, 0.005, f, 2.5, 0.45);
    this.tone(t, f * 0.5, f * 0.5, 0.004, 0.035, 'square');
  },
  thunk() {
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    this.tone(t, 130, 62, 0.07, 0.5);
    this.burst(t, 0.025, 900, 0.7, 0.35, 'lowpass');
    this.burst(t + 0.002, 0.006, 4200, 1.5, 0.2);
  },
  blip(f = 1320, d = 0.035, g = 0.12) {
    if (!this.ok()) return;
    this.tone(this.ctx.currentTime, f, f, d, g, 'triangle');
  },
  err() {
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    this.tone(t, 118, 118, 0.07, 0.16, 'square');
    this.tone(t + 0.09, 92, 92, 0.09, 0.16, 'square');
  },
  chime() {
    if (!this.ok()) return;
    const t = this.ctx.currentTime + 0.01;
    // three bright bells, then a soft fifth underneath — short and dry
    [[1046.5, 0], [1568, 0.085], [2093, 0.17]].forEach(([f, dt]) => {
      this.tone(t + dt, f, f, 0.32, 0.11, 'triangle');
      this.tone(t + dt, f * 2.01, f * 2.01, 0.09, 0.025, 'sine');
    });
    this.tone(t + 0.26, 523.25, 523.25, 0.55, 0.07, 'sine');
    this.tone(t + 0.26, 784, 784, 0.5, 0.05, 'sine');
  },
  connect() {
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    this.tone(t, 880, 880, 0.05, 0.1, 'triangle');
    this.tone(t + 0.07, 1318.5, 1318.5, 0.09, 0.1, 'triangle');
  },
  disconnect() {
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    this.tone(t, 1318.5, 1318.5, 0.05, 0.09, 'triangle');
    this.tone(t + 0.07, 880, 880, 0.09, 0.09, 'triangle');
  },
};

/* ---------- 6. haptics (iOS 18+ <input switch> trick, silent elsewhere) -- */
const Hap = {
  label: $('#hapticLabel'),

/* ---------- 7. LEDs ----------------------------------------------------- */
const LED = {
  el: {
    pwr: $('#ledPwr'), play: $('#ledPlay'), air: $('#ledAir'), shuf: $('#ledShuf'), rpt: $('#ledRpt'),
    vol: $('#ledVol'), seek: $('#ledSeek'), scrl: $('#ledScrl'),
  },
  state: {},
  set(name, mode) {
    if (this.state[name] === mode) return;
    this.state[name] = mode;
    const el = this.el[name];
    el.classList.remove('on', 'dim', 'blink', 'breathe');
    if (mode && mode !== 'off') el.classList.add(mode);
  },
  override: null,              // boot chase takes over temporarily
  sync() {
    if (this.override) return;
    if (S.power !== 'on') {
      for (const k in this.el) this.set(k, 'off');
      this.set('pwr', S.power === 'off' ? 'breathe' : 'on');
      return;
    }
    this.set('pwr', 'on');
    this.set('play', S.playing ? 'on' : (S.cur >= 0 ? 'dim' : 'off'));
    this.set('air', S.wireless ? 'on' : 'off');
    this.set('shuf', S.shuffle ? 'on' : 'off');
    this.set('rpt', S.repeat === 1 ? 'on' : S.repeat === 2 ? 'blink' : 'off');

listeners.push(() => LED.sync());

/* ---------- 8. dot-matrix display: framebuffer + primitives ------------- */
const LW = 160, LH = 92;
const FB = new Uint8Array(LW * LH);   // 0 off · 1 dim · 2 lit · 3 accent
let cx0 = 0, cy0 = 0, cx1 = LW, cy1 = LH;
const clip = (x0, y0, x1, y1) => { cx0 = Math.max(0, x0); cy0 = Math.max(0, y0); cx1 = Math.min(LW, x1); cy1 = Math.min(LH, y1); };
const noClip = () => { cx0 = 0; cy0 = 0; cx1 = LW; cy1 = LH; };
function px(x, y, v) {
  x |= 0; y |= 0;
  if (x < cx0 || y < cy0 || x >= cx1 || y >= cy1) return;
  FB[y * LW + x] = v;
}
function rect(x, y, w, h, v) {
  const xa = Math.max(cx0, x | 0), ya = Math.max(cy0, y | 0);
  const xb = Math.min(cx1, (x + w) | 0), yb = Math.min(cy1, (y + h) | 0);
  for (let j = ya; j < yb; j++) FB.fill(v, j * LW + xa, j * LW + Math.max(xa, xb));
}
const hline = (x, y, w, v) => rect(x, y, w, 1, v);
const vline = (x, y, h, v) => rect(x, y, 1, h, v);
function frameRect(x, y, w, h, v) { hline(x, y, w, v); hline(x, y + h - 1, w, v); vline(x, y, h, v); vline(x + w - 1, y, h, v); }
function dots(x, y, w, v, step = 2) { for (let i = 0; i < w; i += step) px(x + i, y, v); }
function invert(x, y, w, h) {
  for (let j = Math.max(cy0, y); j < Math.min(cy1, y + h); j++)
    for (let i = Math.max(cx0, x); i < Math.min(cx1, x + w); i++) {
      const k = j * LW + i; FB[k] = FB[k] ? 0 : 2;
    }
}

    'H': '1111111F111111', 'I': '0E04040404040E', 'J': '0702020202120C', 'K': '11121418141211',
    'L': '1010101010101F', 'M': '111B1515111111', 'N': '11111915131111', 'O': '0E11111111110E',
    'P': '1E11111E101010', 'Q': '0E11111115120D', 'R': '1E11111E141211', 'S': '0F10100E01011E',
    'T': '1F040404040404', 'U': '1111111111110E', 'V': '11111111110A04', 'W': '1111111515150A',
    'X': '11110A040A1111', 'Y': '1111110A040404', 'Z': '1F01020408101F', '[': '0E08080808080E',
    '\\': '00100804020100', ']': '0E02020202020E', '^': '040A1100000000', '_': '0000000000001F',
    '|': '04040404040404', '·': '00000004000000', '~': '00000815020000',
  };
  for (const k in f5) {
    const s = f5[k], rows = new Uint8Array(7);
    for (let i = 0; i < 7; i++) rows[i] = parseInt(s.substr(i * 2, 2), 16);
    F5.g[k] = rows;
  }
  const f3 = {
    ' ': '00000', '0': '75557', '1': '26227', '2': '71747', '3': '71317', '4': '55711', '5': '74717',
    '6': '74757', '7': '71122', '8': '75757', '9': '75717', 'A': '25755', 'B': '65656', 'C': '34443',
    'D': '65556', 'E': '74647', 'F': '74644', 'G': '34553', 'H': '55755', 'I': '72227', 'J': '11152',
    'K': '55655', 'L': '44447', 'M': '57555', 'N': '65555', 'O': '25552', 'P': '65644', 'Q': '25563',
    'R': '65655', 'S': '34216', 'T': '72222', 'U': '55557', 'V': '55552', 'W': '55575', 'X': '55255',
    'Y': '55222', 'Z': '71247', '.': '00002', ',': '00024', ':': '02020', '-': '00700', '+': '02720',
    '/': '11244', '%': '51245', '>': '42124', '<': '12421', '(': '24442', ')': '42224', '!': '22202',
    '?': '61202', '#': '57575', '&': '25253', "'": '22000', '"': '55000', '_': '00007', '=': '07070',
    '*': '05250', '[': '64446', ']': '32223', '·': '00200', '@': '75747', '|': '22222',
  };
  for (const k in f3) {
    const s = f3[k], rows = new Uint8Array(5);
    for (let i = 0; i < 5; i++) rows[i] = parseInt(s[i], 8);
    F3.g[k] = rows;
  }
})();

/* Display text is uppercase ASCII; accents are folded, unknown glyphs dotted. */
function norm(s) {
  return String(s == null ? '' : s)
    .replace(/ß/g, 'ss').replace(/[Ææ]/g, 'AE').replace(/[Øø]/g, 'O').replace(/[Œœ]/g, 'OE')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[‘’´`]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-')
    .toUpperCase();
}
const textW = (s, f = F5, sc = 1) => (s.length ? s.length * f.adv - 1 : 0) * sc;
function text(s, x, y, f = F5, v = 2, sc = 1) {
  s = norm(s);
  let cx = x | 0;
  for (const ch of s) {
    const rows = f.g[ch] || f.g['·'];
    if (cx + f.w * sc >= cx0 && cx < cx1) {
      for (let r = 0; r < f.h; r++) {
        const bits = rows[r];
        if (!bits) continue;
        for (let c = 0; c < f.w; c++) {
          if (bits & (1 << (f.w - 1 - c))) {
            if (sc === 1) px(cx + c, y + r, v);
            else rect(cx + c * sc, y + r * sc, sc, sc, v);
          }
        }
      }
    }
    cx += f.adv * sc;
  }
  return cx - x - sc;
}
const textC = (s, cxm, y, f = F5, v = 2, sc = 1) => text(s, Math.round(cxm - textW(norm(s), f, sc) / 2), y, f, v, sc);
const textR = (s, xr, y, f = F5, v = 2) => text(s, xr - textW(norm(s), f), y, f, v);
/* horizontally scrolling label inside [x, x+w) — returns true while moving */
function marquee(s, x, y, w, f, v, t, speed = 22) {
  s = norm(s);
  const tw = textW(s, f);
  const ox0 = cx0, ox1 = cx1;
  clip(Math.max(x, ox0), cy0, Math.min(x + w, ox1), cy1);
  let moving = false;
  if (tw <= w) text(s, x, y, f, v);
  else {
    const gap = 24, period = tw + gap;
    const hold = 1.2;                               // rest at the start
    const cyc = period / speed + hold;
    const ph = (t % cyc);
    const off = ph < hold ? 0 : Math.floor((ph - hold) * speed);
    text(s, x - off, y, f, v);
    text(s, x - off + period, y, f, v);
    moving = true;
  }
  cx0 = ox0; cx1 = ox1;
  return moving;
}

/* pixel icons ------------------------------------------------------------ */
const ICON = {};
(function buildIcons() {
  const src = {
    play:  ['X....', 'XX...', 'XXX..', 'XXXX.', 'XXX..', 'XX...', 'X....'],
    pause: ['XX.XX', 'XX.XX', 'XX.XX', 'XX.XX', 'XX.XX', 'XX.XX', 'XX.XX'],
    stop:  ['.....', 'XXXXX', 'XXXXX', 'XXXXX', 'XXXXX', 'XXXXX', '.....'],
    shuf:  ['.....X.', 'XX...XX', '..X.XX.', '...X...', '..X.XX.', 'XX...XX', '.....X.'],
    rpt:   ['.....X.', '.XXXXXX', 'X....X.', 'X.....X', '.X....X', 'XXXXXX.', '.X.....'],
    air:   ['.XXXXX.', 'X.....X', '..XXX..', '.X...X.', '.......', '...X...', '.......'],
    lock:  ['.XXX.', 'X...X', 'X...X', 'XXXXX', 'XX.XX', 'XX.XX', 'XXXXX'],
    spk:   ['...X', '..XX', 'XXXX', 'XXXX', 'XXXX', '..XX', '...X'],
    note:  ['..XXX', '..X.X', '..X..', '..X..', 'XXX..', 'XXX..', '.....'],
    arrR:  ['X..', 'XX.', 'XXX', 'XX.', 'X..'],
    arrL:  ['..X', '.XX', 'XXX', '.XX', '..X'],
    arrU:  ['..X..', '.XXX.', 'XXXXX'],
    arrD:  ['XXXXX', '.XXX.', '..X..'],
    plus:  ['..X..', '..X..', 'XXXXX', '..X..', '..X..'],
    ff:    ['X...X...', 'XX..XX..', 'XXX.XXX.', 'XXXXXXXX', 'XXX.XXX.', 'XX..XX..', 'X...X...'],
    rw:    ['...X...X', '..XX..XX', '.XXX.XXX', 'XXXXXXXX', '.XXX.XXX', '..XX..XX', '...X...X'],
  };
  for (const k in src) {
    const rows = src[k];
    ICON[k] = { w: rows[0].length, h: rows.length, rows };
  }
})();
function icon(name, x, y, v = 2) {
  const ic = ICON[name];
  for (let r = 0; r < ic.h; r++)
    for (let c = 0; c < ic.w; c++)
      if (ic.rows[r][c] === 'X') px(x + c, y + r, v);
  return ic.w;
}
function circle(cx, cy, r, v) {      // midpoint circle outline
  let x = r, y = 0, e = 1 - r;
  while (x >= y) {
    px(cx + x, cy + y, v); px(cx + y, cy + x, v); px(cx - y, cy + x, v); px(cx - x, cy + y, v);
    px(cx - x, cy - y, v); px(cx - y, cy - x, v); px(cx + y, cy - x, v); px(cx + x, cy - y, v);
    y++;
    if (e < 0) e += 2 * y + 1; else { x--; e += 2 * (y - x) + 1; }
  }
}

/* ---------- 9. display renderer: framebuffer -> glass ------------------- */
const THEMES = [
  // name, glass bg, unlit dot, lit, accent, glow
  { name: 'MONO',  bg: '#0B0C0D', unlit: '#17181A', lit: [242, 238, 229], acc: [255, 90, 28],  glow: 0.42 },
  { name: 'AMBER', bg: '#0C0A08', unlit: '#1A1410', lit: [255, 108, 34], acc: [255, 226, 205], glow: 0.5 },
  { name: 'LCD',   bg: '#ADAEA6', unlit: '#A4A59D', lit: [30, 31, 34],   acc: [226, 70, 14],   glow: 0 },
];
const LCD = {
  cv: $('#lcd'), g: null, low: null, lowG: null, img: null, mask: null, P: 6,
  dirty: true, anim: false, flickerUntil: 0, pal: null,
  resize(dpr, s) {
    // dot pitch in device pixels; canvas is sized so one dot = P device px
    const P = Math.max(3, Math.floor(2 * dpr * s + 0.02));
    this.P = P;
    const cv = this.cv;
    cv.width = LW * P; cv.height = LH * P;
    const cssW = LW * P / (dpr * s), cssH = LH * P / (dpr * s);
    cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
    cv.style.left = ((320 - cssW) / 2) + 'px'; cv.style.top = ((192 - cssH) / 2) + 'px';
    this.g = cv.getContext('2d', { alpha: false });
    if (!this.low) {
      this.low = document.createElement('canvas');
      this.low.width = LW; this.low.height = LH;
      this.lowG = this.low.getContext('2d');
      this.img = this.lowG.createImageData(LW, LH);
    }
    this.buildMask();
    this.dirty = true;
  },
  buildMask() {
    const P = this.P, th = THEMES[S.set.theme] || THEMES[0];
    const m = this.mask || (this.mask = document.createElement('canvas'));
    m.width = LW * P; m.height = LH * P;
    const g = m.getContext('2d');
    g.clearRect(0, 0, m.width, m.height);
    g.fillStyle = th.bg;
    g.fillRect(0, 0, m.width, m.height);
    const gap = Math.max(1, Math.round(P * 0.17));
    for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++)
      g.clearRect(x * P, y * P, P - gap, P - gap);
    $('#glass').style.setProperty('--lcd-bg', th.bg);
    this.palette();
  },
  palette() {
    const th = THEMES[S.set.theme] || THEMES[0];
    const b = [0.42, 0.56, 0.7, 0.85, 1][clamp(S.set.bright, 1, 5) - 1];
    const lcdTheme = th.glow === 0;
    // on the reflective LCD, "brightness" is contrast; on emissive themes it's light
    const mix = (c, k) => lcdTheme ? c.map((v, i) => Math.round(lerp(parseInt(th.unlit.substr(1 + i * 2, 2), 16), v, k))) : c.map(v => Math.round(v * k));
    this.pal = [
      [0, 0, 0, 0],
      [...mix(th.lit, b * (lcdTheme ? 0.42 : 0.34)), 255],
      [...mix(th.lit, b), 255],
      [...mix(th.acc, lcdTheme ? Math.max(0.75, b) : b), 255],
    ];
    this.theme = th;
    this.dirty = true;
  },
  blit(t) {
    const d = this.img.data, pal = this.pal;
    for (let i = 0, j = 0; i < FB.length; i++, j += 4) {
      const c = pal[FB[i]];
      d[j] = c[0]; d[j + 1] = c[1]; d[j + 2] = c[2]; d[j + 3] = c[3];
    }
    this.lowG.putImageData(this.img, 0, 0);
    const g = this.g, W = this.cv.width, H = this.cv.height, th = this.theme;
    g.globalAlpha = 1;
    g.fillStyle = S.power === 'off' ? th.bg : th.unlit;
    g.fillRect(0, 0, W, H);
    let a = 1, oy = 0;
    if (t < this.flickerUntil) {          // track-change flicker + line jitter
      a = 0.55 + Math.random() * 0.45;
      oy = Math.random() < 0.3 ? this.P : 0;
    }
    if (th.glow) {
      g.imageSmoothingEnabled = true;
      g.globalAlpha = th.glow * a;
      g.drawImage(this.low, 0, oy, W, H);
    }
    g.imageSmoothingEnabled = false;
    g.globalAlpha = a;
    g.drawImage(this.low, 0, oy, W, H);
    g.globalAlpha = th.glow ? 0.92 : 1;
    g.drawImage(this.mask, 0, 0);
  },
  flicker(ms = 140) { this.flickerUntil = now() + ms; },
};

/* ---------- 10. toasts / overlays --------------------------------------- */
const OV = { kind: null, until: 0, a: null, b: null, start: 0 };
function overlay(kind, a, b, ms = 1100) {
  OV.kind = kind; OV.a = a; OV.b = b; OV.start = now(); OV.until = OV.start + ms;
  LCD.dirty = true;
}
function toast(a, b, ms) { overlay('toast', a, b, ms); }

function drawOverlay(t) {
  if (!OV.kind) return false;
  if (t > OV.until) { OV.kind = null; LCD.dirty = true; return false; }
  const age = (t - OV.start) / 1000;
  if (OV.kind === 'toast') {
    const l1 = norm(OV.a), l2 = OV.b ? norm(OV.b) : '';
    const w = Math.max(textW(l1, F5), textW(l2, F3)) + 14;
    const h = l2 ? 23 : 15;
    const x = Math.round((LW - w) / 2), y = Math.round((LH - h) / 2);
    rect(x - 1, y - 1, w + 2, h + 2, 0);
    frameRect(x, y, w, h, 2);
    textC(l1, LW / 2, y + 4, F5, 2);
    if (l2) textC(l2, LW / 2, y + 14, F3, 3);
  } else if (OV.kind === 'hold') {
    const x = 50, y = 22, w = 60, h = 46;
    rect(x - 1, y - 1, w + 2, h + 2, 0);
    frameRect(x, y, w, h, 2);
    // big padlock, drawn at 3x
    const ic = ICON.lock;
    for (let r = 0; r < ic.h; r++) for (let c = 0; c < ic.w; c++)
      if (ic.rows[r][c] === 'X') rect(x + 23 + c * 3, y + 6 + r * 3, 3, 3, 3);
    textC(OV.a ? 'HOLD' : 'HOLD OFF', LW / 2, y + 33, F5, 2);
  }
  return true;
}

/* ---------- 11. screens -------------------------------------------------- */
const fmtTime = s => {
  s = Math.max(0, Math.floor(s || 0));
  const m = Math.floor(s / 60), r = s % 60;
  return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
};
const two = n => (n < 10 ? '0' : '') + n;

function statusBar(t, title) {
  // left: transport state + track counter (or a screen title)
  if (title) {
    text(title, 0, 1, F3, 2);
  } else {
    icon(S.playing ? 'play' : (S.cur >= 0 ? 'pause' : 'stop'), 0, 0, S.playing ? 3 : 2);
    const n = S.tracks.length;
    text(n ? `${two(S.cur + 1)}/${two(n)}` : '--/--', 9, 1, F3, 2);
  }
  // middle: encoder mode tag (inverted chip) or HOLD
  if (S.hold) {
    icon('lock', 66, 0, 3); text('HOLD', 73, 1, F3, 3);
  } else if (!title) {
    const tag = ['VOL', 'SEEK', 'SCRL'][S.encMode];
    const w = textW(tag, F3) + 4, x = 80 - Math.round(w / 2);
    rect(x, 0, w, 7, 2); text(tag, x + 2, 1, F3, 0);
  }
  // right: shuffle · repeat · wireless (dim when off)
  icon('shuf', 128, 0, S.shuffle ? 2 : 1);
  icon('rpt', 138, 0, S.repeat ? 2 : 1);
  if (S.repeat === 2) text('1', 146, 2, F3, 3);
  icon('air', 153, 0, S.wireless ? 3 : 1);
  dots(0, 8, LW, 1, 2);
}

/* standby: glass dark, a single dim prompt */
function drawStandby(t) {
  const blinkOn = (t % 1600) < 1000;
  textC('TOUCH TO POWER ON', LW / 2, 43, F3, blinkOn ? 1 : 0);
  return true;
}

/* boot sequence — returns false when finished */
const BOOT_MS = 2300;
let bootStart = 0, bootFreeze = null;
function drawBoot(t) {
  const b = bootFreeze != null ? bootFreeze : t - bootStart;
  if (b < 90) { rect(0, 0, LW, LH, 2); return true; }                 // lamp test
  if (b < 200) return true;
  if (b < 720) {                                                        // pixel sweep
    const x = Math.floor((b - 200) / 520 * (LW + 8));
    for (let y = 0; y < LH; y++) for (let i = 0; i < Math.min(x, LW); i++)
      if (((i + y) & 1) === 0 && ((i * 7 + y * 13) % 11) > (x - i) / 8) px(i, y, 1);
    rect(x, 0, 3, LH, 3);
    return true;
  }
  if (b < 840) return true;
  // logo with blink, then tagline + progress
  const blinkOff = (b > 1040 && b < 1120) || (b > 1240 && b < 1300);
  if (!blinkOff) textC('MP-1', LW / 2, 18, F5, 2, 4);
  if (b > 1300) textC('PORTABLE AUDIO PLAYER', LW / 2, 54, F3, 1);
  if (b > 1420) {
    const p = clamp((b - 1420) / 620, 0, 1);
    frameRect(40, 66, 80, 5, 1);
    rect(41, 67, Math.round(78 * p), 3, 2);
    textC(p < 1 ? 'LOADING LIBRARY' : (S.tracks.length ? `${S.tracks.length} SONGS` : 'READY'), LW / 2, 76, F3, p < 1 ? 1 : 3);
  }
  if (b > 2120) {                                                       // blinds out
    const k = Math.floor((b - 2120) / 180 * 8);
    for (let y = 0; y < LH; y++) if ((y % 8) < k) hline(0, y, LW, 0);
  }
  return b < BOOT_MS;
}

/* empty library: friendly prompt */
function drawEmpty(t) {
  statusBar(t);
  // dotted cassette-ish slot with a plus, blinking softly
  const on = (t % 1400) < 900;
  frameRect(58, 16, 44, 30, 1);
  for (let i = 0; i < 44; i += 2) { px(58 + i, 16, 2); px(58 + i, 45, 2); }
  for (let i = 0; i < 30; i += 2) { px(58, 16 + i, 2); px(101, 16 + i, 2); }
  if (on) { rect(79, 23, 2, 16, 3); rect(72, 30, 16, 2, 3); }
  textC('NO SONGS', LW / 2, 54, F5, 2);
  const s1 = 'PRESS ', s2 = '02 ADD';
  const w = textW(s1 + s2, F3), x = Math.round((LW - w) / 2);
  text(s1, x, 66, F3, 1);
  text(s2, x + textW(s1, F3) + 1, 66, F3, 3);
  icon('arrD', 77, 76, on ? 3 : 1);
  return true;
}

/* ---------- 12. frame loop ---------------------------------------------- */
const anims = new Set();                // per-frame physics steppers (keys, encoder…)
let lastTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ts - (lastTs || ts)) / 1000);
  lastTs = ts;
  for (const a of anims) if (a(dt, ts) === false) anims.delete(a);
  renderDisplay(ts);
}
function renderDisplay(t) {
  if (!LCD.g) return;
  if (!LCD.dirty && !LCD.anim && t > LCD.flickerUntil && !OV.kind) return;
  FB.fill(0); noClip();
  let anim = false;
  if (S.power === 'off') anim = drawStandby(t);
  else if (S.power === 'boot') {
    anim = drawBoot(t);
    if (!anim && bootFreeze == null) finishBoot();
  } else {
    anim = drawScreen(t);
    noClip();
    anim = drawOverlay(t) || anim;
  }
  LCD.blit(t);
  LCD.anim = anim;
  LCD.dirty = false;
}
function drawScreen(t) {
  if (!S.tracks.length) return drawEmpty(t);
  return drawEmpty(t);
}

/* ---------- 13. power on + boot ----------------------------------------- */
function powerOn() {
  if (S.power !== 'off') return;
  Snd.unlock();
  Hap.tap();
  S.power = 'boot';
  bootStart = now();
  commit();
  // LED lamp test chase alongside the display boot
  LED.override = true;
  const order = ['pwr', 'play', 'air', 'shuf', 'rpt', 'scrl', 'seek', 'vol'];
  order.forEach((k, i) => {
    setTimeout(() => LED.set(k, 'on'), 1240 + i * 70);
    setTimeout(() => LED.set(k, k === 'pwr' ? 'on' : 'off'), 1240 + i * 70 + 260);
  });
  LED.set('pwr', 'on');
  setTimeout(() => Snd.blip(2400, 0.02, 0.06), 200);
  setTimeout(() => Snd.chime(), 840);
}
function finishBoot() {
  S.power = 'on';
  LED.override = null;
  S.screen = S.tracks.length ? 'now' : 'empty';
  LCD.flicker(120);
  commit();
}
$('#stage').addEventListener('pointerdown', e => {
  if (S.power === 'off') { e.stopPropagation(); e.preventDefault(); powerOn(); }
}, true);

/* ---------- 14. iOS page hygiene ---------------------------------------- */
['gesturestart', 'gesturechange', 'gestureend', 'dblclick', 'contextmenu', 'selectstart'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

/* ---------- 15. start ---------------------------------------------------- */
function relayout() {
  fitDevice();
  const s = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s')) || 1;
  LCD.resize(window.devicePixelRatio || 1, s);
}
addEventListener('resize', relayout);
relayout();
LED.sync();
requestAnimationFrame(frame);

/* debug/test hooks (harmless in production) */
window.__mp1 = { S, LCD, powerOn, commit, overlay, toast, render: () => { LCD.dirty = true; renderDisplay(now()); }, freezeBoot: ms => { bootFreeze = ms; LCD.dirty = true; } };
window.__errs = [];
addEventListener('error', e => window.__errs.push(String(e.message)));
</script>
</body>
